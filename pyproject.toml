[project]
name = "fluxcast-domains"
version = "0.1.0"
description = "Free name.fluxcast.dev subdomains for developers — GitOps DNS via pull requests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "fluxcast" }]
dependencies = [
    "cloudflare>=4.0.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
fluxcast-sync = "fluxcast_domains.sync:main"
fluxcast-raw-api = "fluxcast_domains.raw_api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
